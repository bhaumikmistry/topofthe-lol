name: Add site from issue

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: add-site-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  add:
    # Runs on a new add-site issue, and again when someone comments "recheck"
    # after starring or forking.
    if: >-
      contains(github.event.issue.labels.*.name, 'add-site') &&
      ((github.event_name == 'issues' &&
        (github.event.action == 'opened' || github.event.label.name == 'add-site')) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, 'recheck')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The issue-form template applies the label as the issue is opened, so
      # this workflow fires twice for the same issue. One branch per issue plus
      # this check makes the second run a no-op instead of a failure.
      - name: Skip if this issue already has a branch
        id: guard
        run: |
          BRANCH="add-site/issue-${{ github.event.issue.number }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists — another run handled this issue."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse issue and add the site
        id: add
        if: steps.guard.outputs.skip != 'true'
        # The issue body is untrusted input, so it is passed as an environment
        # variable and never interpolated into the shell. The script's error
        # text stays in a file rather than a step output, so a crafted body
        # cannot inject anything into the workflow.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if node scripts/from-issue.mjs > "$RUNNER_TEMP/out.txt" 2> "$RUNNER_TEMP/err.txt"; then
            cat "$RUNNER_TEMP/out.txt" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/err.txt"
          fi

      - name: Comment and stop if it could not be added
        if: steps.guard.outputs.skip != 'true' && steps.add.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "Could not add this one automatically:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/err.txt"
            echo '```'
            echo
            echo "Edit the issue and the bot will try again, or open a pull request against \`data/sites.json\` yourself."
          } > "$RUNNER_TEMP/comment.md"
          # Opening an issue from the template fires both "opened" and
          # "labeled", so the same explanation can be produced twice.
          REASON="$(head -c 200 "$RUNNER_TEMP/err.txt")"
          if gh issue view "$NUMBER" --json comments -q '.comments[].body' | grep -qF "$REASON"; then
            echo "Already said this."
            exit 0
          fi
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"

      # The listing is free and permanent, so the asking price is a star or a
      # fork. The repo owner is exempt.
      - name: Check the requester starred or forked
        id: support
        if: steps.guard.outputs.skip != 'true' && steps.add.outputs.failed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$AUTHOR" = "$OWNER" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "users/$AUTHOR/starred/$REPO" --silent 2>/dev/null; then
            echo "Starred."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$REPO/forks" --paginate -q '.[].owner.login' | grep -qxF "$AUTHOR"; then
            echo "Forked."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Neither starred nor forked."
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Ask for a star or a fork
        if: steps.support.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          gh issue edit "$NUMBER" --add-label "needs a star" >/dev/null
          gh issue comment "$NUMBER" --body "$(printf 'Read the board fine, @%s, and the entry is ready.\n\nListings here are free and permanent, and the only thing asked in return is a star or a fork on https://github.com/%s. Do either one, then comment `recheck` on this issue and the bot will pick it straight back up.' "$AUTHOR" "$REPO")"

      - name: Validate the result
        if: steps.support.outputs.ok == 'true'
        run: node scripts/validate.mjs

      - name: Open the pull request
        if: steps.support.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN: ${{ steps.add.outputs.domain }}
          SUMMARY: ${{ steps.add.outputs.summary }}
          NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "bid-bot"
          git config user.email "bid-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/sites.json data/bids.json
          git commit -m "feat: list ${DOMAIN}" -m "Closes #${NUMBER}"
          git push -u origin "$BRANCH"

          BODY="Requested in #${NUMBER}. The bot ${SUMMARY}."$'\n\n'"Merging publishes it — the site rebuilds statically from \`data/bids.json\`."
          # Creating pull requests needs "Allow GitHub Actions to create and
          # approve pull requests" in repo settings. If it is off, the branch is
          # still pushed, so fall back to handing over the compare link.
          if gh pr create --title "Add ${DOMAIN}" --body "$BODY" --head "$BRANCH" --base "${{ github.event.repository.default_branch }}"; then
            # Validation has already passed and the board has a readable number,
            # so there is nothing left for a human to weigh up.
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              gh issue comment "$NUMBER" --body "Merged — the bot ${SUMMARY}. It is on https://topofthe.lol as soon as the site rebuilds."
            else
              gh issue comment "$NUMBER" --body "Opened a pull request — the bot ${SUMMARY}. It needs a manual merge."
            fi
          else
            gh issue comment "$NUMBER" --body "The bot ${SUMMARY} and pushed \`${BRANCH}\`, but could not open the pull request itself. Open it here: https://github.com/${REPO}/compare/${BRANCH}?expand=1"
          fi
