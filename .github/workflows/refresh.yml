name: Refresh bids

on:
  schedule:
    # Every 30 minutes. GitHub queues cron jobs, so expect a few minutes of drift.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bids
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh bids
        run: node scripts/refresh.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/bids.json; then
            echo "No bid changes."
            exit 0
          fi
          git config user.name "bid-bot"
          git config user.email "bid-bot@users.noreply.github.com"
          git add data/bids.json
          git commit -m "chore: refresh bids"
          git push
