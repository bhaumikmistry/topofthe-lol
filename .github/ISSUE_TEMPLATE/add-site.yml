name: Add a site
description: Suggest a bid site to list on topofthe.lol
title: 'Add: '
labels: ['add-site']
body:
  - type: markdown
    attributes:
      value: |
        Fill in the domain and submit. A bot reads the site's current top bid, opens the pull
        request and merges it, usually within a minute.

        Two conditions. **Star or fork this repo first** — listings are free and permanent, and
        that is the whole asking price. And the board has to **publish a number the bot can
        read**; boards that render their leaderboard in JavaScript with no endpoint cannot be
        listed until they expose one.

        If you star or fork after opening the issue, comment `recheck` and the bot picks it back
        up.
  - type: input
    id: domain
    attributes:
      label: Domain
      description: A .lol hostname only — no https://, no trailing slash. Other extensions are not listed.
      placeholder: outbid.lol
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: JSON endpoint (optional)
      description: >
        Only if you know it. Most of these sites expose their board at a path like /api/leaderboard,
        /api/board or /api/listings. Leave blank and the bot will scrape the homepage instead.
      placeholder: /api/leaderboard
  - type: input
    id: tagline
    attributes:
      label: One-line description (optional)
      description: Leave blank to use the site's own meta description.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is a live .lol pay-to-rank / bidding site, not a placeholder or parked domain.
          required: true
        - label: I have starred or forked this repo.
          required: true
